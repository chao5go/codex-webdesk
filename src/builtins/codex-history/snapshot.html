<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex · 会话历史</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d6956'/%3E%3Cpath d='m8 10 6 6-6 6m9 0h7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#25322e;background:#f5f6f2;font-size:16px;--muted:#64736d;--green:#1d6956;--line:#dce3db}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8fcab0;outline-offset:2px}header{padding:25px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}h1{font-size:22px;letter-spacing:-.6px;margin:0}.brand{display:flex;align-items:center;gap:13px}.mark{background:var(--green);color:white;padding:8px 11px;border-radius:10px;font-family:monospace;font-weight:bold}.sub{color:var(--muted);font-size:13px;margin-top:4px}.button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 14px;white-space:nowrap}.primary{background:var(--green);color:white;border-color:var(--green)}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);height:calc(100dvh - 98px)}aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#eef1eb}.filters{padding:20px 18px 14px;display:grid;gap:10px}input,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;color:inherit;font-size:14px}.filter-line{display:flex;gap:8px}.filter-line select{min-width:0}.count{color:var(--muted);font-size:13px}.list{overflow:auto;padding:0 10px 14px}.session{width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:15px 12px;border-radius:9px;margin-bottom:5px;color:inherit}.session:hover{background:#e4eae1}.session.active{background:white;border-color:#a9c4b4;box-shadow:0 2px 6px #183e2610}.session-title{font-weight:600;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.session-meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}.project{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}main{min-height:0;display:flex;flex-direction:column;background:#fff}.detail-head{padding:25px 32px 20px;border-bottom:1px solid var(--line)}h2{font-size:21px;line-height:1.5;margin:0 0 12px;overflow-wrap:anywhere}.metadata{color:var(--muted);font-size:13px;line-height:1.8;overflow-wrap:anywhere}.command-row{margin-top:17px;display:flex;gap:10px}.command-row input{font-family:ui-monospace,monospace;background:#f5f7f3;min-width:0}.messages{overflow:auto;padding:28px 32px;scroll-behavior:smooth}.message{max-width:960px;margin:0 auto 24px;border-left:3px solid #dbe4dd;padding:0 0 0 18px}.message.user{border-color:#3a9374}.message-label{display:flex;gap:12px;align-items:center;font-weight:600;font-size:13px;color:var(--green);margin-bottom:10px}.message-label time{color:var(--muted);font-size:12px;font-weight:400}.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.85;margin:0;font-family:inherit}.empty{padding:60px 25px;text-align:center;color:var(--muted);line-height:1.8}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#253d32;color:#fff;border-radius:10px;max-width:90vw;z-index:5}.error{color:#a13730}.hidden{display:none!important}.toolbar{display:flex;align-items:center;gap:12px}.mobile-back{display:none}.status{font-size:13px;color:var(--muted)}@media(min-width:1400px){.layout{grid-template-columns:390px minmax(0,1fr)}.detail-head,.messages{padding-left:48px;padding-right:48px}}@media(max-width:760px){header{padding:16px}.layout{height:calc(100dvh - 81px);grid-template-columns:1fr}main{display:none}body.detail-open aside{display:none}body.detail-open main{display:flex}.mobile-back{display:inline-block;margin-bottom:15px}.detail-head{padding:18px}.messages{padding:22px 18px}.command-row{flex-wrap:wrap}.command-row input{flex:1 1 100%}.status{display:none}h2{font-size:19px}}
.danger{color:#a13730;border-color:#e7c7c3}.button:disabled{opacity:.55;cursor:wait}.command-row{flex-wrap:wrap}.command-row input{flex:1 1 280px}
.session-row{display:flex;align-items:flex-start;gap:6px}.session-row .pick{width:18px;height:18px;flex:0 0 18px;margin:19px 0 0 4px;accent-color:var(--green)}.session-row .session{min-width:0}#merge-tools{display:flex;gap:8px;flex-wrap:wrap}dialog{width:min(640px,calc(100% - 32px));max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:24px;color:inherit}dialog::backdrop{background:#14241e70}dialog label{display:block;margin:18px 0 8px;font-size:14px}textarea{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#merge-command{font-family:ui-monospace,monospace}#merge-summary{white-space:pre-wrap;max-height:140px;overflow:auto}
</style>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">&gt;_</span><div><h1>Codex 会话历史</h1><div class="sub">找到对话，接着做。</div></div></div><div class="toolbar"><span id="status" class="status"></span><button id="refresh" class="button">刷新会话</button></div></header>
<div class="layout"><aside aria-label="会话列表"><div class="filters"><input id="search" type="search" placeholder="搜索标题、目录、ID 或对话内容" aria-label="搜索会话"><div class="filter-line"><select id="project" aria-label="筛选项目"><option value="">全部项目</option></select><select id="archive" aria-label="筛选状态"><option value="active">正常会话</option><option value="all">包含归档</option><option value="archived">仅归档</option></select></div><div id="merge-tools"><button id="select-all" class="button">全选当前列表</button><button id="clear-picks" class="button">清空选择</button><button id="merge" class="button primary" disabled>合并后继续（0）</button></div><div id="export-tools" class="filter-line"><select id="export-format" aria-label="导出格式"><option value="html">HTML 离线快照</option><option value="md">Markdown</option><option value="json">JSON</option></select><button id="export" class="button">导出全部</button></div><div class="count" id="count" aria-live="polite">正在读取…</div></div><div id="list" class="list"></div></aside><main id="detail"><div class="empty">选择一段会话，查看对话并复制恢复命令。</div></main></div>
<div id="toast" class="toast hidden" role="status"></div>
<dialog id="merge-dialog" aria-labelledby="merge-title">
<h2 id="merge-title">合并上下文，继续工作</h2>
<p class="metadata">生成本地交接文件，让新的 Codex CLI 会话读取后继续。原会话会保留。</p>
<div id="merge-summary" class="metadata"></div>
<label for="merge-objective">接下来想做什么（选填）</label>
<textarea id="merge-objective" maxlength="2000" rows="3" placeholder="例如：结合这几段讨论，继续完成 ETL 任务的增量逻辑。"></textarea>
<div id="merge-result" class="hidden"><p id="merge-info" class="metadata"></p><p class="metadata">在保存这些会话的服务器终端运行，文件需保留到新会话读取完成。</p><textarea id="merge-command" rows="4" readonly aria-label="合并后继续的命令"></textarea><button id="copy-merge" class="button primary">复制启动命令</button></div>
<p id="merge-error" class="error" role="alert"></p>
<div class="dialog-actions"><button id="close-merge" class="button">关闭</button><button id="create-merge" class="button primary">生成继续命令</button></div>
</dialog>
<script>
const embedded = /*SESSION_DATA*/null;
const $ = id => document.getElementById(id);
let sessions = [], selected = null, toastTimer, loading = false, csrfToken = "", deleting = false;
const picked = new Set();let merging = false, exporting = false;
const date = value => {const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});};
function el(tag, cls, text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3000);}
function filtered(){const q=$('search').value.trim().toLowerCase();return sessions.filter(s=>(!$('project').value||s.cwd===$('project').value)&&($('archive').value==='all'||s.archived===($('archive').value==='archived'))&&(!q||s.searchText.includes(q)));}
function updatePicks(){for(const id of picked)if(!sessions.some(s=>s.id===id))picked.delete(id);$('merge-tools').classList.toggle('hidden',Boolean(embedded));$('merge').textContent=`合并后继续（${picked.size}）`;$('merge').disabled=picked.size<2||picked.size>20;$('export-tools').classList.toggle('hidden',Boolean(embedded));$('merge').title=picked.size>20?'合并最多选择 20 段会话':'';if(!exporting)$('export').textContent=picked.size?`导出已选（${picked.size}）`:'导出全部';}
function renderList(){updatePicks();const rows=filtered();$('count').textContent=`${rows.length} 段会话 · 共 ${sessions.length} 段`;$('list').replaceChildren();if(!rows.length){$('list').append(el('div','empty','没有找到匹配的会话。'));return;}const fragment=document.createDocumentFragment();for(const s of rows){const b=el('button','session'+(s.id===selected?' active':''));b.setAttribute('aria-pressed',String(s.id===selected));b.append(el('div','session-title',s.title));const meta=el('div','session-meta');const project=el('span','project',(s.archived?'归档 · ':'')+(s.cwd.split(/[\\/]/).filter(Boolean).pop()||'无项目目录'));project.title=s.cwd;meta.append(project,el('span','',date(s.updated)));b.append(meta);b.onclick=()=>select(s.id);const wrap=el('div','session-row');if(!embedded){const check=el('input','pick');check.type='checkbox';check.checked=picked.has(s.id);check.setAttribute('aria-label','选择会话：'+s.title);check.onchange=()=>{check.checked?picked.add(s.id):picked.delete(s.id);updatePicks();};wrap.append(check);}wrap.append(b);fragment.append(wrap);}$('list').append(fragment);}
async function copyCommand(input,button){const original=button.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(input.value);}else{input.focus();input.select();if(!document.execCommand('copy'))throw Error('copy');}button.textContent='已复制 ✓';toast('命令已复制，粘贴到终端即可。');setTimeout(()=>button.textContent=original,1800);}catch{input.focus();input.select();toast('请按 Ctrl+C 或 ⌘C 复制已选中的命令。');}}
function select(id){selected=id;const s=sessions.find(x=>x.id===id);if(!s)return;document.body.classList.add('detail-open');renderList();const head=el('div','detail-head');const back=el('button','button mobile-back','← 返回会话列表');back.onclick=()=>document.body.classList.remove('detail-open');head.append(back,el('h2','',s.title));head.append(el('div','metadata',`${s.cwd||'无项目目录'}\n${s.messages.length} 条消息${s.model?' · '+s.model:''} · 更新于 ${date(s.updated)}${s.archived?' · 已归档':''}`));const row=el('div','command-row');const command=el('input');command.readOnly=true;command.value=s.command;command.setAttribute('aria-label','恢复此会话的终端命令');const button=el('button','button primary','复制恢复命令');button.onclick=()=>copyCommand(command,button);row.append(command,button);if(!embedded){const remove=el('button','button danger','删除会话');remove.onclick=()=>deleteSession(s,remove);row.append(remove);}head.append(row);const messages=el('div','messages');messages.tabIndex=0;messages.setAttribute('aria-label','对话内容');if(!s.messages.length)messages.append(el('div','empty','这段会话暂无可展示的文本消息。'));const fragment=document.createDocumentFragment();for(const m of s.messages){const article=el('article','message '+m.role);const label=el('div','message-label',m.role==='user'?'你':'Codex');label.append(el('time','',date(m.time)));article.append(label,el('pre','text',m.text));fragment.append(article);}messages.append(fragment);$('detail').replaceChildren(head,messages);}
async function deleteSession(session,button){
  if(deleting||!confirm(`删除会话「${session.title}」？\n\n会话文件会移入本地回收站，并从历史列表移除。请先退出正在运行的会话。\n不会删除项目代码。`))return;
  deleting=true;button.disabled=true;button.textContent='正在删除…';
  try{
    const response=await fetch('api/sessions/delete',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({id:session.id})});
    const result=await response.json();if(!response.ok)throw Error(result.error||'删除失败，请重试。');
    if(selected===session.id)selected=null;
    await load();document.body.classList.remove('detail-open');toast('会话已移入本地回收站。');
  }catch(error){toast(error.message);}
  finally{deleting=false;button.disabled=false;button.textContent='删除会话';}
}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;try{let data=embedded;if(!data){if(location.protocol==='file:')throw Error('请运行 python3 server.py，或先导出独立 HTML 文件。');const r=await fetch('api/sessions');if(!r.ok)throw Error('读取会话失败，请检查本地服务是否运行。');data=await r.json();}csrfToken=data.csrfToken||"";sessions=data.sessions.map(s=>({...s,searchText:[s.title,s.cwd,s.id,...s.messages.map(m=>m.text)].join('\n').toLowerCase()}));const project=$('project').value;$('project').replaceChildren(new Option('全部项目',''));for(const cwd of [...new Set(sessions.map(s=>s.cwd).filter(Boolean))].sort())$('project').append(new Option(cwd,cwd));$('project').value=[...$('project').options].some(o=>o.value===project)?project:'';$('status').textContent=data.exported?'离线快照':'会话管理';$('status').title=data.source;if(data.exported){$('refresh').textContent='离线快照';$('refresh').title='重新运行导出命令可更新此文件';}renderList();if(selected&&sessions.some(s=>s.id===selected))select(selected);else if(!sessions.length){$('detail').replaceChildren(el('div','empty',data.exists?'还没有找到会话记录。':'会话目录不存在：'+data.source));}else{$('detail').replaceChildren(el('div','empty','选择一段会话，查看对话并复制恢复命令。'));}}catch(e){$('count').textContent='读取失败';$('detail').replaceChildren(el('div','empty error',e.message));}finally{loading=false;$('refresh').disabled=Boolean(embedded);}}
$('merge').onclick=()=>{const rows=sessions.filter(s=>picked.has(s.id));$('merge-summary').textContent=rows.map(s=>'• '+s.title).join('\n');$('merge-result').classList.add('hidden');$('merge-error').textContent='';$('create-merge').disabled=false;$('merge-dialog').showModal();};
$('clear-picks').onclick=()=>{picked.clear();renderList();};
$('select-all').onclick=()=>{for(const s of filtered())picked.add(s.id);renderList();};
$('export').onclick=async()=>{if(exporting)return;exporting=true;const button=$('export'),count=picked.size||sessions.length;button.disabled=true;button.textContent='正在导出…';try{const response=await fetch('api/sessions/export',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({ids:[...picked],format:$('export-format').value})});if(!response.ok){let message='导出失败，请重试。';try{message=(await response.json()).error||message;}catch{}throw Error(message);}const name=(response.headers.get('Content-Disposition')||'').match(/filename="([^"]+)"/)?.[1]||'codex-history';const url=URL.createObjectURL(await response.blob());const link=el('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${count} 段会话。`);}catch(e){toast(e.message);}finally{exporting=false;button.disabled=false;updatePicks();}};
$('merge-objective').oninput=()=>{if(!merging){$('create-merge').disabled=false;$('merge-result').classList.add('hidden');}};
$('close-merge').onclick=()=>$('merge-dialog').close();
$('copy-merge').onclick=()=>copyCommand($('merge-command'),$('copy-merge'));
$('create-merge').onclick=async()=>{if(merging)return;merging=true;$('create-merge').disabled=true;$('merge-error').textContent='';try{const response=await fetch('api/sessions/merge',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({ids:[...picked],objective:$('merge-objective').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'生成失败');$('merge-command').value=data.command;$('merge-info').textContent=`已整理 ${data.sessions} 段会话、${data.messages} 条消息（${Math.ceil(data.bytes/1024)} KB）。新会话启动后会梳理进度。`;$('merge-result').classList.remove('hidden');}catch(e){$('merge-error').textContent=e.message;$('create-merge').disabled=false;}finally{merging=false;}};
$('search').addEventListener('input',renderList);$('project').onchange=renderList;$('archive').onchange=renderList;$('refresh').onclick=load;load();
</script>
</body></html>
